name: Build Fullscreen Saffollo APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Fullscreen Android App
        run: |
          mkdir -p app/src/main/java/com/saffollo/academy app/src/main/res/drawable

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SaffolloAcademy"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.saffollo.academy'
              compileSdk 34

              defaultConfig {
                  applicationId "com.saffollo.academy"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="সাফল্য একাডেমি"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/saffollo/academy/MainActivity.java
          package com.saffollo.academy;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;
          import androidx.webkit.WebSettingsCompat;
          import androidx.webkit.WebViewFeature;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.Map;

          public class MainActivity extends Activity {
              private static final String SITE_URL = "https://saffollo.com/";
              private static final int FILE_CHOOSER_REQUEST_CODE = 100;

              private WebView webView;
              private ProgressBar progressBar;
              private ValueCallback<Uri[]> filePathCallback;
              private final Map<String, String> cleanHeaders = new HashMap<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#003366"));

                  cleanHeaders.put("X-Requested-With", "");

                  FrameLayout root = new FrameLayout(this);

                  webView = new WebView(this);
                  root.addView(webView, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                  ));

                  progressBar = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progressBar.setMax(100);
                  progressBar.setProgressTintList(ColorStateList.valueOf(Color.parseColor("#f59e0b")));
                  FrameLayout.LayoutParams pbParams = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, 10
                  );
                  root.addView(progressBar, pbParams);

                  setContentView(root);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);
                  settings.setUserAgentString("Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36");

                  if (WebViewFeature.isFeatureSupported(WebViewFeature.REQUESTED_WITH_HEADER_ALLOW_LIST)) {
                      WebSettingsCompat.setRequestedWithHeaderOriginAllowList(settings, Collections.emptySet());
                  }

                  CookieManager cookieManager = CookieManager.getInstance();
                  cookieManager.setAcceptCookie(true);
                  cookieManager.setAcceptThirdPartyCookies(webView, true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String url = uri.toString();
                          if (url.startsWith("tel:") || url.startsWith("mailto:") || url.startsWith("whatsapp:") || url.startsWith("intent:")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, uri));
                              } catch (Exception ignored) {}
                              return true;
                          }
                          if ("GET".equalsIgnoreCase(request.getMethod()) && (url.startsWith("http://") || url.startsWith("https://"))) {
                              String host = uri.getHost();
                              if (host != null && host.contains("saffollo.com")) {
                                  view.loadUrl(url, cleanHeaders);
                                  return true;
                              }
                          }
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int newProgress) {
                          if (newProgress < 100) {
                              progressBar.setVisibility(View.VISIBLE);
                              progressBar.setProgress(newProgress);
                          } else {
                              progressBar.setVisibility(View.GONE);
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (MainActivity.this.filePathCallback != null) {
                              MainActivity.this.filePathCallback.onReceiveValue(null);
                          }
                          MainActivity.this.filePathCallback = filePathCallback;
                          try {
                              startActivityForResult(fileChooserParams.createIntent(), FILE_CHOOSER_REQUEST_CODE);
                          } catch (Exception e) {
                              MainActivity.this.filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimetype, long contentLength) {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (Exception ignored) {}
                      }
                  });

                  webView.loadUrl(SITE_URL, cleanHeaders);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (filePathCallback != null) {
                          Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                          filePathCallback.onReceiveValue(results);
                          filePathCallback = null;
                      }
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          if [ -f "icon-512.png" ]; then
            cp "icon-512.png" app/src/main/res/drawable/ic_launcher.png
          elif [ -f "icon.png" ]; then
            cp "icon.png" app/src/main/res/drawable/ic_launcher.png
          else
            FIRST_PNG=$(ls *.png 2>/dev/null | head -n 1 || true)
            if [ -n "$FIRST_PNG" ]; then
              cp "$FIRST_PNG" app/src/main/res/drawable/ic_launcher.png
            else
              cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#004b8d" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,28 L78,76 L30,76 Z"/>
          </vector>
          EOF
            fi
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK File
        run: cp app/build/outputs/apk/debug/app-debug.apk SaffolloAcademy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaffolloAcademy-APK
          path: SaffolloAcademy.apk
