name: Build Saffollo Academy APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android Project Files
        run: |
          mkdir -p app/src/main/java/com/saffollo/academy app/src/main/res/drawable

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SaffolloAcademy"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.saffollo.academy'
              compileSdk 34

              defaultConfig {
                  applicationId "com.saffollo.academy"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.browser:browser:1.8.0'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.support.customtabs.action.CustomTabsService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="সাফল্য একাডেমি"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/saffollo/academy/MainActivity.java
          package com.saffollo.academy;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import androidx.browser.customtabs.CustomTabColorSchemeParams;
          import androidx.browser.customtabs.CustomTabsIntent;

          public class MainActivity extends Activity {
              private static final String SITE_URL = "https://saffollo.com";
              private boolean hasLaunched = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (savedInstanceState != null) {
                      hasLaunched = savedInstanceState.getBoolean("hasLaunched", false);
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  outState.putBoolean("hasLaunched", hasLaunched);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (hasLaunched) {
                      finish();
                  } else {
                      hasLaunched = true;
                      openWebsite();
                  }
              }

              private void openWebsite() {
                  Uri uri = Uri.parse(SITE_URL);
                  try {
                      CustomTabColorSchemeParams params = new CustomTabColorSchemeParams.Builder()
                              .setToolbarColor(Color.parseColor("#004b8d"))
                              .build();

                      CustomTabsIntent customTabsIntent = new CustomTabsIntent.Builder()
                              .setDefaultColorSchemeParams(params)
                              .setShowTitle(true)
                              .setUrlBarHidingEnabled(true)
                              .build();

                      customTabsIntent.launchUrl(this, uri);
                  } catch (Exception e) {
                      Intent fallback = new Intent(Intent.ACTION_VIEW, uri);
                      startActivity(fallback);
                  }
              }
          }
          EOF

          if [ -f "icon-512.png" ]; then
            cp "icon-512.png" app/src/main/res/drawable/ic_launcher.png
          elif [ -f "icon.png" ]; then
            cp "icon.png" app/src/main/res/drawable/ic_launcher.png
          else
            FIRST_PNG=$(ls *.png 2>/dev/null | head -n 1 || true)
            if [ -n "$FIRST_PNG" ]; then
              cp "$FIRST_PNG" app/src/main/res/drawable/ic_launcher.png
            else
              cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#004b8d" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,28 L78,76 L30,76 Z"/>
          </vector>
          EOF
            fi
          fi

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK File
        run: cp app/build/outputs/apk/debug/app-debug.apk SaffolloAcademy.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SaffolloAcademy-APK
          path: SaffolloAcademy.apk
